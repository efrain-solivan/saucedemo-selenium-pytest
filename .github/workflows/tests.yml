name: UI tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 12 * * 1"   # weekly, catches changes on the live site
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run suite (headless Chrome)
        run: pytest
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/
